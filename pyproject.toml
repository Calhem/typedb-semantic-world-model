[project]
name = "worldmodel"
version = "0.1.0"
description = "A small, evidence-aware semantic world model on TypeDB 3 (research software)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["typedb-driver==3.14.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
