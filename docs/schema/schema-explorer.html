<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Schema Explorer</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f23; --muted: #5d6470; --line: #dfe1e5; --soft: #eef0f2;
  --accent: #2459c9; --accent-ink: #ffffff; --focus: #2459c9;
  --db: #1f6f43; --db-bg: #e3f3e9; --rc: #7a4f00; --rc-bg: #fbefd5; --rp: #5b3a99; --rp-bg: #eee7fa;
  --ok: #1f6f43; --ok-bg: #e3f3e9; --sh: #20608a; --sh-bg: #e1eff8; --cu: #8a5300; --cu-bg: #fdecd0;
  --un: #a1262b; --un-bg: #fbe3e3; --code: #f2f3f5;
  --m0: #3d5a80; --m1: #b5523b; --m2: #2f7d6d; --m3: #8a5fbf; --m4: #a0782a; --m5: #c04a7b; --m6: #4f7d2f;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171a; --panel: #1d2024; --ink: #e7e9ec; --muted: #a2a9b4; --line: #343941; --soft: #262a30;
  --accent: #7aa2ff; --accent-ink: #0d1117; --focus: #7aa2ff;
  --db: #7fd6a1; --db-bg: #1c3527; --rc: #f2c46d; --rc-bg: #3b2f14; --rp: #c6a8ff; --rp-bg: #2d2342;
  --ok: #7fd6a1; --ok-bg: #1c3527; --sh: #8cc8f0; --sh-bg: #17303f; --cu: #f2b45a; --cu-bg: #3d2b10;
  --un: #ff9a9a; --un-bg: #431c1e; --code: #23272d;
  --m0: #8fb0d9; --m1: #f0957f; --m2: #7cc9b6; --m3: #c3a3ef; --m4: #dcb769; --m5: #f08fb8; --m6: #a3d17d;
} }
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1d2024; --ink: #e7e9ec; --muted: #a2a9b4; --line: #343941; --soft: #262a30;
  --accent: #7aa2ff; --accent-ink: #0d1117; --focus: #7aa2ff;
  --db: #7fd6a1; --db-bg: #1c3527; --rc: #f2c46d; --rc-bg: #3b2f14; --rp: #c6a8ff; --rp-bg: #2d2342;
  --ok: #7fd6a1; --ok-bg: #1c3527; --sh: #8cc8f0; --sh-bg: #17303f; --cu: #f2b45a; --cu-bg: #3d2b10;
  --un: #ff9a9a; --un-bg: #431c1e; --code: #23272d;
  --m0: #8fb0d9; --m1: #f0957f; --m2: #7cc9b6; --m3: #c3a3ef; --m4: #dcb769; --m5: #f08fb8; --m6: #a3d17d;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin: 6px 0; white-space: pre; }
header.top { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 16px; margin: 0; white-space: nowrap; }
header.top .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
header.top .spacer { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - var(--head, 52px)); }
aside { border-right: 1px solid var(--line); background: var(--panel); padding: 12px; position: sticky; top: var(--head, 52px);
  height: calc(100vh - var(--head, 52px)); overflow-y: auto; }
main { padding: 16px 22px 60px; min-width: 0; }
#menu-toggle { display: none; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); display: none; }
  aside.open { display: block; }
  #menu-toggle { display: inline-block; }
  main { padding: 14px 16px 50px; }
  header.top { position: static; }
  svg.nb { min-width: 600px; }
}
input[type=search], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; width: 100%; }
label.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; margin: 2px 0; }
fieldset { border: 0; padding: 0; margin: 10px 0; }
legend { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.filters .wide { grid-column: 1 / -1; }
.count { color: var(--muted); font-size: 12px; }
#results { list-style: none; margin: 6px 0 0; padding: 0; }
#results li a { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px; border-radius: 5px; color: var(--ink); }
#results li a:hover, #results li a.active { background: var(--soft); text-decoration: none; }
#results li a[aria-current="page"] { background: var(--soft); font-weight: 600; }
.tree { list-style: none; margin: 0; padding-left: 0; }
.tree .tree { padding-left: 14px; border-left: 1px solid var(--line); margin-left: 7px; }
.tree li { margin: 0; }
.kind-head { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 2px; }
.dim { opacity: .45; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; line-height: 1.6; padding: 0 7px;
  border-radius: 999px; border: 1px solid transparent; white-space: nowrap; font-weight: 500; vertical-align: 1px; }
.src-database { color: var(--db); background: var(--db-bg); border-color: var(--db); }
.src-reconstructed { color: var(--rc); background: var(--rc-bg); border-color: var(--rc); }
.src-repository { color: var(--rp); background: var(--rp-bg); border-color: var(--rp); border-style: dashed; }
.st-attributed { color: var(--ok); background: var(--ok-bg); }
.st-shared { color: var(--sh); background: var(--sh-bg); }
.st-consistent_unverified { color: var(--cu); background: var(--cu-bg); }
.st-unresolved { color: var(--un); background: var(--un-bg); font-weight: 600; }
.mod { color: var(--panel); background: var(--mc); }
.kindtag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.ann { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 14px 0; }
section.card > h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
section.card.repo { border-style: dashed; border-color: var(--rp); }
section.card.recon { border-color: var(--rc); }
h1.page { font-size: 22px; margin: 4px 0 4px; word-break: break-word; }
.sub { color: var(--muted); margin: 0 0 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; word-break: break-word; }
.notice { padding: 8px 12px; border-radius: 8px; margin: 10px 0; }
.notice.bad { background: var(--un-bg); color: var(--un); }
.notice.warn { background: var(--cu-bg); color: var(--cu); }
.notice.good { background: var(--ok-bg); color: var(--ok); }
svg.nb { width: 100%; height: auto; display: block; }
.nbwrap { overflow-x: auto; }
svg.nb text { font: 12px -apple-system, Segoe UI, sans-serif; fill: var(--ink); }
svg.nb .node rect { fill: var(--soft); stroke: var(--line); }
svg.nb .node.center rect { fill: var(--accent); stroke: var(--accent); }
svg.nb .node.center text { fill: var(--accent-ink); font-weight: 600; }
svg.nb .node a:hover rect, svg.nb .node a:focus rect { stroke: var(--accent); stroke-width: 2; }
svg.nb .edge { stroke: var(--muted); fill: none; stroke-width: 1.2; }
svg.nb .elabel { fill: var(--muted); font-size: 11px; }
.facts td:first-child { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
details > summary { cursor: pointer; color: var(--muted); }
kbd { font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; background: var(--soft); }
.sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<header class="top">
  <button id="menu-toggle" aria-controls="side" aria-expanded="false">Menu</button>
  <h1><a href="#/" id="home">Schema Explorer</a></h1>
  <div class="meta" id="meta"></div>
  <div class="spacer"></div>
  <div class="legend" id="legend" aria-label="Legend"></div>
  <button id="theme" aria-label="Switch colour theme">Theme</button>
</header>
<div class="layout">
  <aside id="side" aria-label="Search and filters">
    <label for="q" class="sr">Search</label>
    <input id="q" type="search" placeholder="Search types, roles, functions  ( / )" autocomplete="off">
    <label class="chk"><input type="checkbox" id="q-docs"> also search repository comments</label>
    <fieldset>
      <legend>Filters</legend>
      <div class="filters">
        <select id="f-kind" aria-label="Kind"><option value="">Any kind</option><option>entity</option><option>relation</option><option>attribute</option></select>
        <select id="f-status" aria-label="Attribution status"><option value="">Any status</option></select>
        <select id="f-module" class="wide" aria-label="Module"></select>
        <select id="f-ann" aria-label="Annotation"><option value="">Any annotation</option></select>
        <select id="f-scope" aria-label="Scope"><option value="">Core and profiles</option><option value="core">Core only</option><option value="profile">Profiles only</option></select>
        <label class="chk wide"><input type="checkbox" id="f-abstract"> abstract only</label>
        <label class="chk wide"><input type="checkbox" id="f-extended"> extended by a profile</label>
      </div>
    </fieldset>
    <div class="count" id="count" aria-live="polite"></div>
    <ul id="results" aria-label="Matching types"></ul>
    <nav id="navlinks" class="small" style="margin-top:14px"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

:{"files":["schema/profiles/laboratory/laboratory-0.1.tql"],"statements":8,"unread":[],"missing_from_scan":[]},"profile:mechanical":{"files":["schema/profiles/mechanical/mechanical-0.1.tql"],"statements":5,"unread":[],"missing_from_scan":[]},"profile:organisation":{"files":["schema/profiles/organisation/organisation-0.1.tql"],"statements":16,"unread":[],"missing_from_scan":[]}}}},"documentation":{"provenance":"repository","description":"Comments from the .tql files of the modules recorded in the database, read from this repository (export.code_commit). Not checked against the database; they never affect attribution or any database field.","modules":{"profile:mechanical":{"files":["schema/profiles/mechanical/mechanical-0.1.tql"],"header":"Profile mechanical-0.1 (Core 0.4 Stage D-1, LABS-1.023). Additive vocabulary only (D-D-1, D-D-9): installed after the full core with WorldModel.install_profile(\"mechanical\"). Assemblies and components use core part-of; part kinds, materials, joint kinds and the assembly/component categories are vocabulary (D-D-11: \"component\" is a category, not a kind). Dependency kinds are core (core-0.4-d)."},"profile:organisation":{"files":["schema/profiles/organisation/organisation-0.1.tql"],"header":"Profile organisation-0.1 (Core 0.4 Stage D-2, LABS-1.026). Additive vocabulary only (D-D-1, D-D-9): installed after the full core with WorldModel.install_profile(\"organisation\"). Membership (member-of), organisational structure (part-of), ordinary roles, abilities (capability classifications) and agency are core."},"profile:laboratory":{"files":["schema/profiles/laboratory/laboratory-0.1.tql"],"header":"Profile laboratory-0.1 (Core 0.4 Stage D-3, LABS-1.028). Additive vocabulary only (D-D-1, D-D-9): installed after the full core with WorldModel.install_profile(\"laboratory\"). Measurement (activity, result record, proposition), rests-on, comparability, units, corrections, constitution, location, hypotheses (stance) and processes are core (Stage B and C). Specimens and experiments are classifications (laboratory:specimen, laboratory:experiment)."},"core":{"files":["schema/core/core-0.3.tql"],"header":"Semantic world model, core module 0.3.0 (World Ontology v0.2 baseline, docs/architecture/world-ontology-v0.2.md). TypeDB 3.14.1. Four layers (v0.2 §1): reality vocabulary (particulars, occurrences, concepts, reference systems, worlds); content (propositions, event descriptions); stance (attestations, supersession); judgement (acceptance). TypeDB enforces here: kinds and the roles they may play; one attester, one content and one world per attestation; one holder and one target per acceptance; unique ids and unique proposition keys; allowed values. Everything about truth at a time, perspectives, inheritance and answer statuses is application logic (src/worldmodel/semantics.py)."},"core-0.4-a0":{"files":["schema/core/core-0.4-a0.tql","schema/core/core-0.4-a0-slots.tql"],"header":"Core 0.4, Stage A0 groundwork module (LABS-1.002). Additive to core-0.3.tql; installed after it. A0.1: every proposition owns a deterministic, immutable identifier `wm-id` (p: + 24 hex characters of the SHA-256 of its canonical key), so propositions can be role players and are looked up like every other identified thing. The canonical key keeps its meaning (structural identity of content); the id is derived from it and never changes. For an existing Core 0.3 database, use WorldModel.upgrade_to_a0(): TypeDB rejects adding `@key` while propositions lack the attribute (CNT5), so the upgrade owns the attribute first, writes the ids, then adds the key. Core 0.4, Stage A0.3 (LABS-1.002): functional-slot declarations, stored as data in TypeDB (U-4: implementation choice consistent with \"TypeDB is the only store\"; profile packaging is Stage D). A declaration (a functional constraint) says: for content of this proposition type and of all its subtypes, at most one value of `value-role` holds at a time for each combination of the `slot-role` players. located-at has slot (located) and value place; a seat assignment might have slot (venue, seat) and value occupant. A type may have several constraints. Subtypes inherit every constraint of their ancestors, and their own declarations add constraints; nothing replaces or weakens an inherited one (U-5, LABS-1.003). Role names are core role names (a specialised role is named by the core role it specialises)."},"core-0.4-a":{"files":["schema/core/core-0.4-a.tql"],"header":"Core 0.4, Stage A1 (LABS-1.006): physical structure, first increment. Additive to core-0.3 and core-0.4-a0. Types from World Ontology v0.2 (§3.4-3.5) and the Core 0.4 plan (Stage A); no new foundational categories. - constitution: what a particular is made from (a cover from a cut aluminium blank). Materials are not types: they are categories (classified-as(x, steel)); a category is marked as a material by classified-as(steel, material). - positioned-in: a particular's position in a spatial frame, as per-axis ranges in metres (lower = upper for an exact value), with an optional orientation as a unit quaternion (w, x, y, z; Hamilton, active). The ranges are content parameters, so a different position is a different proposition (keys use 12 significant digits; U-3 open). - anchored-to: a frame attached to a particular (the gearbox's own frame moves with the gearbox). - frame-transform(parent P, child C): the pose of C's origin and axes in P, p_P = R(q)·p_C + t (plan 9.6). Stored and retrievable in A1; composing chains into derived poses is deferred to the next increment (A2)."},"core-0.4-a2":{"files":["schema/core/core-0.4-a2.tql"],"header":"Core 0.4, Stage A2 (LABS-1.007): spatial reasoning support. Additive to core-0.4-a. frames_linked: every frame connected to $f through frame-transform facts attested in world $w, in either direction and transitively (records only: time, acceptance and perspective are applied in Python, as with parts_in). Verified to terminate on cyclic frame graphs (probes/core04_a2_probes.py). Distinct variable names per branch (REP44). The module also declares two functional constraints whose value is the content's parameters (`@params`, compared by range overlap and rotation equality; see WorldModel.declare_slot): one position per thing per frame at a time, and one transform per (parent, child) pair at a time."},"core-0.4-b":{"files":["schema/core/core-0.4-b.tql"],"header":"Core 0.4, Stage B (LABS-1.010): dynamics and causality. Additive to core-0.3 (which already has occurrence, event descriptions, describes, initiates and terminates) and the Stage A modules. causes(cause, effect): a source's claim that one happening caused another (World Ontology v0.2 §3.2, plan 9.3). Asserted, never inferred: not from temporal succession, not transitively. Its players are event descriptions (a description-level claim: the happenings as described) or occurrences (an occurrence-level claim). A description-level claim answers an occurrence-level question only through describes links usable by the asking perspective (lifting, in Python). Processes and actions are classifications of events (v0.2 DR-05); process membership is part-of between occurrences (occurrences are particulars). No other type is added."},"core-0.4-c":{"files":["schema/core/core-0.4-c1.tql","schema/core/core-0.4-c2.tql"],"header":"Core 0.4, Stage C1 (LABS-1.016): qualities, units and measurements. Additive; World Ontology v0.2 §3.3 and the Core 0.4 plan 9.2 (DX-2 amended). No new foundational category. - Units and quality kinds have a dimension (mass, length, temperature...). A unit converts to the dimension's SI unit by si = raw * si-factor + si-offset. Reported content (has-quality ranges) is stored in the SI unit. - A measurement is three things: the measuring activity (an event description classified `measurement`), the result record (an information-object: what the act produced, with its raw value, standard uncertainty, coverage factor, conditions and calibration reference, intrinsic to the record), and the reported content (a has-quality range). produced(activity, result) and reports(result, content) link them; both are ordinary attested content. - expressed-in(record, unit): the unit the record's raw value is written in. Structural, like the record's other attributes (what the record says does not change), so it is not an attested proposition (decision D-C-1, provisionally approved LABS-1.017). Core 0.4, Stage C2 (LABS-1.016): capabilities. Plan 9.5 (DX-3, approved provisionally). A capability is a concept (what something can do: can-weigh, can-sign-off), held through classified-as(holder, capability, context?) over an attested interval, like a social role. Agency is not a type: it is the category `agent`, held the same way (World Ontology v0.2: \"agency is a capacity, not a kind\")."},"core-0.4-d":{"files":["schema/core/core-0.4-d.tql"],"header":"Core 0.4 Stage D (LABS-1.023; decision D-D-2): the dependency kind of World Ontology v0.2 §3.4 (\"depends-on with a dependency-kind concept\"). Core conformance, not a profile: profiles never modify core types. Additive: a depends-on without a kind keeps its canonical key and its provenance, and is read as \"kind unspecified\", never as any particular kind. A typed dependency is a different proposition from the untyped one for the same pair. The kinds are categories; the core seeds physical, functional, informational and control (model.MODULE_CONCEPTS), and profiles may add their own."}},"types":{"acceptance":[{"module":"core","file":"schema/core/core-0.3.tql","line":128,"comment":"judgement A perspective's decision about an attestation. World-independent: the attestation already names its world.","declares":["relation acceptance","acceptance relates holder","acceptance relates holder @card(1..1)","acceptance relates accepted","acceptance relates accepted @card(1..1)","acceptance owns wm-id","acceptance owns wm-id @key","acceptance owns verdict","acceptance owns recorded-at","acceptance owns r <script>
"use strict";
const D = JSON.parse(document.getElementById("export-data").textContent);
const S = D.schema, A = D.attribution, DOC = D.documentation, MD = D.module_data;
const TYPES = S.types, ROLES = S.roles, FUNS = S.functions;
const KIND_ORDER = ["entity", "relation", "attribute"];
const STATUS_TEXT = {attributed: "attributed", shared: "shared", consistent_unverified: "consistent, unverified", unresolved: "unresolved"};
const SRC_TEXT = {database: "database", reconstructed: "reconstructed", repository: "repository"};
const MODULES = A.modules.map(m => m.name);
const PROFILES = A.modules.filter(m => m.kind === "profile").map(m => m.name);
const MOD_COLOUR = {};
MODULES.forEach((m, i) => { MOD_COLOUR[m] = A.modules[i].kind === "core" ? "var(--m0)" : A.modules[i].kind === "setup" ? "var(--m4)"
  : ["var(--m1)", "var(--m2)", "var(--m3)", "var(--m5)", "var(--m6)"][PROFILES.indexOf(m) % 5]; });

// ---- small, safe DOM helpers (all text goes through textContent) ----
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v; else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(svgNS, tag);

  return el;
}
const enc = x => encodeURIComponent(x);
const typeLink = l => TYPES[l] ? h("a", {href: "#type/" + enc(l)}, l) : h("span", {}, l);
const roleLink = r => ROLES[r] ? h("a", {href: "#role/" + enc(r)}, r) : h("span", {}, r);
const funLink = f => h("a", {href: "#fun/" + enc(f)}, f + "()");
const modLink = m => h("a", {href: "#module/" + enc(m), class: "badge mod", style: "--mc:" + (MOD_COLOUR[m] || "var(--muted)")}, m);
const srcBadge = p => h("span", {class: "badge src-" + p, title: D.provenance[p]}, "source: " + SRC_TEXT[p]);
const stBadge = st => h("span", {class: "badge st-" + st, title: A.statuses[st]}, STATUS_TEXT[st]);
const anns = list => list && list.length ? h("span", {class: "ann"}, " " + list.join(" ")) : null;
function attrib(fid) {
  const a = A.facts[fid];
  if (!a) return h("span", {class: "count"}, "—");
  return h("span", {class: "chips"}, stBadge(a.status), a.modules.map(modLink));
}
function card(title, provenance, ...kids) {
  const cls = provenance === "repository" ? "card repo" : provenance === "reconstructed" ? "card recon" : "card";
  return h("section", {class: cls}, h("h2", {}, title, provenance ? srcBadge(provenance) : null), ...kids);
}
function table(head, rows) {
  if (!rows.length) return h("p", {class: "count"}, "None.");
  return h("div", {class: "tablewrap"}, h("table", {}, h("thead", {}, h("tr", {}, head.map(x => h("th", {}, x)))),
    h("tbody", {}, rows.map(r => h("tr", {}, r.map(c => h("td", {}, c)))))));
}

// ---- header and legend ----
function header() {
  const src = D.source, ex = D.export;
  const ver = A.verification === "verified";
  document.getElementById("meta").append(
    h("span", {}, "database ", h("b", {}, src.database || "—")),
    h("span", {}, src.server_version),
    h("span", {title: src.schema_sha256}, "schema ", h("span", {class: "mono"}, src.schema_sha256.slice(0, 12))),
    h("span", {}, "exported ", ex.exported_at || "—"),
    h("a", {href: "#checks", class: "badge " + (ver ? "st-attributed" : "st-unresolved")},
      ver ? "attribution verified" : "attribution NOT verified"));
  document.getElementById("legend").append(
    srcBadge("database"), srcBadge("reconstructed"), srcBadge("repository"),
    h("a", {href: "#checks"}, "what these mean"));
  document.title = "Schema Explorer: " + (src.database || "export");
}

// ---- search and filters ----
const docText = {};
for (const [l, es] of Object.entries(DOC.types)) docText["type:" + l] = es.map(e => e.comment).join(" ").toLowerCase();
for (const [f, es] of Object.entries(DOC.functions)) docText["fun:" + f] = es.map(e => e.comment).join(" ").toLowerCase();
const ITEMS = [
  ...Object.values(TYPES).map(t => ({k: "type", id: t.label, kind: t.kind, href: "#type/" + enc(t.label)})),
  ...Object.values(ROLES).map(r => ({k: "role", id: r.role, kind: "role", href: "#role/" + enc(r.role)})),
  ...Object.keys(FUNS).map(f => ({k: "fun", id: f, kind: "function", href: "#fun/" + enc(f)})),
];
function typeStatuses(l) { return new Set(TYPES[l].facts.map(f => A.facts[f] && A.facts[f].status)); }
function typeModules(l) { const t = A.types[l]; return new Set([...t.introduced_by.modules, ...t.extended_by]); }
function passes(item, f) {
  if (item.k !== "type") return !(f.kind || f.abstract || f.extended || f.ann) && moduleOk(item, f) && statusOk(item, f);
  const t = TYPES[item.id], at = A.types[item.id];
  if (f.kind && t.kind !== f.kind) return false;
  if (f.abstract && !t.abstract) return false;
  if (f.extended && !at.extended_by.some(m => PROFILES.includes(m))) return false;
  if (f.ann) {
    const all = [...t.annotations, ...(t.value_type ? t.value_type.annotations : []),
      ...t.owns.concat(t.plays, t.relates).filter(c => c.declared).flatMap(c => c.annotations)];
    if (!all.some(a => a.startsWith(f.ann))) return false;

  return moduleOk(item, f) && statusOk(item, f);
}
function itemModules(item) {
  if (item.k === "type") return typeModules(item.id);
  if (item.k === "fun") return new Set(A.functions[item.id].modules);
  const r = ROLES[item.id]; const a = A.facts[r.relation + " relates " + r.name];
  return new Set(a ? a.modules : []);
}
function moduleOk(item, f) {
  const ms = itemModules(item);
  if (f.module && !ms.has(f.module)) return false;
  if (f.scope === "core" && ![...ms].every(m => !PROFILES.includes(m))) return false;
  if (f.scope === "profile" && ![...ms].some(m => PROFILES.includes(m))) return false;
  return true;
}
function statusOk(item, f) {
  if (!f.status) return true;
  if (item.k === "type") return typeStatuses(item.id).has(f.status);
  if (item.k === "fun") return A.functions[item.id].status === f.status;
  const r = ROLES[item.id]; const a = A.facts[r.relation + " relates " + r.name];
  return a && a.status === f.status;
}
function score(item, q, docs) {
  if (!q) return 1;
  const id = item.id.toLowerCase();
  const name = item.k === "role" ? id.split(":")[1] : id;

function neighbourhood(label) {

  const down = t.subtypes.slice(0, 6);
  const left = t.kind === "attribute"
    ? Object.keys(TYPES).filter(o => TYPES[o].owns.some(x => x.attribute === label && x.declared)).slice(0, 8).map(o => [o, "owned by"])

    right = t.relates.filter(r => r.declared).flatMap(r => ROLES[r.role].played_by_declared.slice(0, 3).map(p => [p, r.name])).slice(0, 9);
  } else {
    right = t.plays.filter(p => p.declared).map(p => [p.role.split(":")[0], p.role.split(":")[1]]).slice(0, 9);
  }
  const W = 760, bw = 150, bh = 26, gap = 10;
  const rows = Math.max(left.length, right.length, 1);
  const midH = rows * (bh + gap);
  const H = 20 + up.length * (bh + 22) + Math.max(midH, bh) + (down.length ? bh + 40 : 0) + 20;
  const svg = s("svg", {class: "nb", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Neighbourhood of " + label});
  const box = (x, y, l, center) => {
    const g = s("g", {class: "node" + (center ? " center" : "")});
    const inner = [s("rect", {x, y, width: bw, height: bh, rx: 6}),
      s("text", {x: x + bw / 2, y: y + 17, "text-anchor": "middle"}, l.length > 21 ? l.slice(0, 20) + "…" : l)];
    if (!center && TYPES[l]) {

      a.append(s("title", {}, l)); g.append(a);
    } else g.append(...inner);
    return g;
  };
  let y = 20;
  const cx = W / 2 - bw / 2;
  for (const u of up) { svg.append(box(cx, y, u)); svg.append(s("path", {class: "edge", d: `M${W / 2} ${y + bh} V${y + bh + 22}`})); y += bh + 22; }
  const midTop = y, cy = midTop + Math.max(midH, bh) / 2 - bh / 2;
  if (up.length) svg.lastChild.setAttribute("d", `M${W / 2} ${midTop - 22} V${cy}`);
  svg.append(box(cx, cy, label, true));
  const side = (items, x, anchorX) => items.forEach(([l, lab], i) => {
    const yy = midTop + i * (bh + gap) + (Math.max(midH, bh) - items.length * (bh + gap) + gap) / 2;
    svg.append(s("path", {class: "edge", d: `M${anchorX} ${cy + bh / 2} C ${(anchorX + x + (x > anchorX ? 0 : bw)) / 2} ${cy + bh / 2}, ${(anchorX + x + (x > anchorX ? 0 : bw)) / 2} ${yy + bh / 2}, ${x > anchorX ? x : x + bw} ${yy + bh / 2}`}));
    svg.append(box(x, yy, l));
    svg.append(s("text", {class: "elabel", x: x > anchorX ? x - 6 : x + bw + 6, y: yy - 2, "text-anchor": x > anchorX ? "end" : "start"}, lab));
  });
  side(left, 20, cx);
  side(right, W - 20 - bw, cx + bw);
  if (down.length) {
    const dy = midTop + Math.max(midH, bh) + 40;

  return h("div", {}, h("div", {class: "nbwrap"}, svg), h("p", {class: "count"}, "Declared neighbours only (inherited ones are in the tables). ",
    more.length ? more.join(", ") + " not drawn." : ""));
}

      h("dt", {}, "server"), h("dd", {}, D.source.server_version),
      h("dt", {}, "schema SHA-256"), h("dd", {class: "mono small"}, D.source.schema_sha256))),
    card("Modules", "reconstructed", table(["module", "kind", "version", "replay", "declarations by status"], A.modules.map(m => [modLink(m.name), m.kind,
      m.recorded_version || "—", m.replay, h("span", {class: "chips"}, Object.entries(m.facts).map(([st, n]) => h("span", {}, stBadge(st), " " + n)))]))),
    card("Start here", null, h("div", {class: "chips"}, ["particular", "event", "proposition", "attestation"].filter(l => TYPES[l]).map(typeLink),
      h("a", {href: "#data"}, "module data"), h("a", {href: "#checks"}, "checks and sources")),
      h("p", {class: "count"}, "Press ", h("kbd", {}, "/"), " to search. Every type, role and module is a link; the browser's back button works.")),
    h("p", {class: "count"}, "Export: " + D.export.exporter + (D.export.code_commit ? " · code " + D.export.code_commit.slice(0, 10) + (D.export.code_dirty ? " (uncommitted changes)" : "") : ""))];
}
function notFound(what, id) { return [h("h1", {class: "page"}, "Not in this schema"), h("p", {}, "There is no " + what + " “" + id + "” in this export.")]; }

function route() {
  const raw = location.hash.slice(1) || "/";
  const [path, query] = raw.split("?");
  const params = new URLSearchParams(query || "");
  const [kind, ...rest] = path.split("/");
  const id = decodeURIComponent(rest.join("/"));
  let content;
  if (kind === "type") content = typePage(id);
  else if (kind === "role") content = rolePage(id);
  else if (kind === "fun") content = funPage(id);
  else if (kind === "module") content = modulePage(id);
  else if (kind === "facts") content = factsPage(params);
  else if (kind === "data") content = dataPage();
  else if (kind === "checks") content = checksPage();
  else content = overview();
  const main = document.getElementById("main");
  main.replaceChildren(...[content].flat().filter(Boolean));
  window.scrollTo(0, 0);
  markCurrent();
  if (window.innerWidth <= 820) { document.getElementById("side").classList.remove("open"); document.getElementById("menu-toggle").setAttribute("aria-expanded", "false"); }
}

// ---- keyboard: "/" focuses search; arrows move through results; Enter opens ----
document.addEventListener("keydown", e => {
  const q = document.getElementById("q");
  if (e.key === "/" && document.activeElement !== q && !/input|select|textarea/i.test(document.activeElement.tagName)) {
    e.preventDefault(); document.getElementById("side").classList.add("open"); q.focus(); q.select();
  }
});
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "Enter") {
    const first = document.querySelector("#results a");
    if (first) { e.preventDefault(); if (e.key === "Enter") location.hash = first.getAttribute("href"); else first.focus(); }
  }
});
document.getElementById("results").addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const links = [...document.querySelectorAll("#results a")];
  const i = links.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  (links[i + (e.key === "ArrowDown" ? 1 : -1)] || (e.key === "ArrowUp" ? document.getElementById("q") : links[i])).focus();
});
document.getElementById("menu-toggle").addEventListener("click", e => {
  const side = document.getElementById("side"); side.classList.toggle("open");
  e.target.setAttribute("aria-expanded", side.classList.contains("open") ? "true" : "false");
});
document.getElementById("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("schema-explorer-theme", document.documentElement.dataset.theme); } catch (err) { /* storage unavailable */ }
});
try { const t = localStorage.getItem("schema-explorer-theme"); if (t) document.documentElement.dataset.theme = t; } catch (err) { /* storage unavailable */ }
const nav = document.getElementById("navlinks");
nav.append(h("div", {}, h("a", {href: "#/"}, "Overview"), " · ", h("a", {href: "#checks"}, "Checks"), " · ", h("a", {href: "#facts"}, "All declarations"), " · ", h("a", {href: "#data"}, "Module data")));
nav.append(h("div", {class: "chips", style: "margin-top:8px"}, A.modules.map(m => modLink(m.name))));
const fitHeader = () => document.documentElement.style.setProperty("--head", document.querySelector("header.top").offsetHeight + "px");
window.addEventListener("resize", fitHeader);
header();
fitHeader();
setupFilters();
renderResults();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
